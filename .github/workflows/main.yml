name: Build Windows EXE x64
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nuitka zstandard minecraft-launcher-lib
      - run: python -m nuitka --standalone --assume-yes-for-downloads --onefile --include-package-data=minecraft_launcher_lib --follow-imports main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Minecraft_Terminal_Launcher
          path: Minecraft_Terminal_Launcher-0.0.1-windows-amd64.exe
