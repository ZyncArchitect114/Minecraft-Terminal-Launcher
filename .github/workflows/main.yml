name: Build All Platforms

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  VERSION: '0.0.1'

jobs:
  # ============================================================
  # Linux x64
  # ============================================================
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install nuitka zstandard minecraft_launcher_lib

      - name: Build
        run: |
          python -m nuitka \
            --mode=onefile \
            --follow-imports \
            --assume-yes-for-downloads \
            --include-package-data=minecraft_launcher_lib \
            --output-filename=Minecraft_Terminal_Launcher \
            main.py

      - name: Package tar.gz
        run: |
          tar -czvf Minecraft_Terminal_Launcher-${{ env.VERSION }}-linux-x64.tar.gz \
            Minecraft_Terminal_Launcher

      - uses: actions/upload-artifact@v4
        with:
          name: Minecraft_Terminal_Launcher-${{ env.VERSION }}-linux-x64
          path: Minecraft_Terminal_Launcher-${{ env.VERSION }}-linux-x64.tar.gz

  # ============================================================
  # Linux ARM64
  # ============================================================
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install nuitka zstandard minecraft_launcher_lib

      - name: Build
        run: |
          python -m nuitka \
            --mode=onefile \
            --follow-imports \
            --assume-yes-for-downloads \
            --include-package-data=minecraft_launcher_lib \
            --output-filename=Minecraft_Terminal_Launcher \
            main.py

      - name: Package tar.gz
        run: |
          tar -czvf Minecraft_Terminal_Launcher-${{ env.VERSION }}-linux-arm64.tar.gz \
            Minecraft_Terminal_Launcher

      - uses: actions/upload-artifact@v4
        with:
          name: Minecraft_Terminal_Launcher-${{ env.VERSION }}-linux-arm64
          path: Minecraft_Terminal_Launcher-${{ env.VERSION }}-linux-arm64.tar.gz

  # ============================================================
  # Linux x86 (32-bit) — via i386 Debian container
  # ============================================================
  linux-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build in i386 container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            i386/debian:bookworm \
            bash -c '
              apt-get update && \
              apt-get install -y python3 python3-venv python3-pip patchelf gcc && \
              python3 -m venv .venv && \
              . .venv/bin/activate && \
              pip install -U pip nuitka zstandard minecraft_launcher_lib && \
              python -m nuitka \
                --mode=onefile \
                --follow-imports \
                --assume-yes-for-downloads \
                --include-package-data=minecraft_launcher_lib \
                --output-filename=Minecraft_Terminal_Launcher \
                main.py && \
              tar -czvf Minecraft_Terminal_Launcher-${{ env.VERSION }}-linux-x86.tar.gz \
                Minecraft_Terminal_Launcher
            '

      - uses: actions/upload-artifact@v4
        with:
          name: Minecraft_Terminal_Launcher-${{ env.VERSION }}-linux-x86
          path: Minecraft_Terminal_Launcher-${{ env.VERSION }}-linux-x86.tar.gz

  # ============================================================
  # Windows x64
  # ============================================================
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install nuitka zstandard minecraft_launcher_lib

      - name: Build
        run: |
          python -m nuitka `
            --mode=onefile `
            --follow-imports `
            --assume-yes-for-downloads `
            --include-package-data=minecraft_launcher_lib `
            --output-filename=Minecraft_Terminal_Launcher.exe `
            main.py

      - name: Package tar.gz
        run: |
          tar -czvf Minecraft_Terminal_Launcher-${{ env.VERSION }}-windows-amd64.tar.gz `
            Minecraft_Terminal_Launcher.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Minecraft_Terminal_Launcher-${{ env.VERSION }}-windows-amd64
          path: Minecraft_Terminal_Launcher-${{ env.VERSION }}-windows-amd64.tar.gz

  # ============================================================
  # Windows ARM64
  # ============================================================
  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install nuitka zstandard minecraft_launcher_lib

      - name: Build
        run: |
          python -m nuitka `
            --mode=onefile `
            --follow-imports `
            --assume-yes-for-downloads `
            --include-package-data=minecraft_launcher_lib `
            --output-filename=Minecraft_Terminal_Launcher.exe `
            main.py

      - name: Package tar.gz
        run: |
          tar -czvf Minecraft_Terminal_Launcher-${{ env.VERSION }}-windows-arm64.tar.gz `
            Minecraft_Terminal_Launcher.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Minecraft_Terminal_Launcher-${{ env.VERSION }}-windows-arm64
          path: Minecraft_Terminal_Launcher-${{ env.VERSION }}-windows-arm64.tar.gz

  # ============================================================
  # Windows x86 (32-bit)
  # ============================================================
  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x86

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install nuitka zstandard minecraft_launcher_lib

      - name: Build
        run: |
          python -m nuitka `
            --mode=onefile `
            --follow-imports `
            --assume-yes-for-downloads `
            --include-package-data=minecraft_launcher_lib `
            --output-filename=Minecraft_Terminal_Launcher.exe `
            main.py

      - name: Package tar.gz
        run: |
          tar -czvf Minecraft_Terminal_Launcher-${{ env.VERSION }}-windows-x86.tar.gz `
            Minecraft_Terminal_Launcher.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Minecraft_Terminal_Launcher-${{ env.VERSION }}-windows-x86
          path: Minecraft_Terminal_Launcher-${{ env.VERSION }}-windows-x86.tar.gz
